name: Build APK & Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate web platform files
        run: |
          flutter create --project-name bharatiyam_panchanga --org com.bharatiyam --platforms=web .
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-compute 3-year panchanga data
        run: |
          mkdir -p assets
          flutter test test/generate_panchanga_data_test.dart --timeout 15m || echo "Data generation skipped"
          ls -la assets/ || true

      - name: Build Web
        run: flutter build web --release --base-href /bharatiyam-calender-/

      - name: Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify AdMob in manifest
        run: |
          echo "=== Checking AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          grep "APPLICATION_ID" android/app/src/main/AndroidManifest.xml || { echo "FATAL: AdMob App ID missing from manifest!"; exit 1; }

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-compute 3-year panchanga data
        run: |
          mkdir -p assets
          flutter test test/generate_panchanga_data_test.dart --timeout 15m || echo "Data generation skipped"
          ls -la assets/ || true

      - name: Patch plugins to compileSdk 35
        run: |
          find ~/.pub-cache -name "build.gradle" -path "*/android/*" -type f | while read f; do
            sed -i 's/compileSdkVersion 31/compileSdkVersion 35/g' "$f"
            sed -i 's/compileSdkVersion 33/compileSdkVersion 35/g' "$f"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' "$f"
            sed -i 's/compileSdk 31/compileSdk 35/g' "$f"
            sed -i 's/compileSdk 33/compileSdk 35/g' "$f"
            sed -i 's/compileSdk 34/compileSdk 35/g' "$f"
            sed -i 's/compileSdk = 31/compileSdk = 35/g' "$f"
            sed -i 's/compileSdk = 33/compileSdk = 35/g' "$f"
            sed -i 's/compileSdk = 34/compileSdk = 35/g' "$f"
          done

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --split-per-abi --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify AdMob in FINAL APK
        run: |
          echo "=== Checking FINAL APK manifest ==="
          cd build/app/outputs/flutter-apk/
          APK=$(ls app-arm64-v8a-release.apk 2>/dev/null || ls *.apk | head -1)
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/aapt dump xmltree "$APK" AndroidManifest.xml | grep -A2 "APPLICATION_ID" || echo "WARNING: AdMob not found in final APK!"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bharatiyam-panchanga-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharatiyam-panchanga-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
