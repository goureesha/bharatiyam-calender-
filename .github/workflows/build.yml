name: Build APK & Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform files
        run: |
          flutter create --project-name bharatiyam_panchanga --org com.bharatiyam --platforms=android,web .
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-compute 3-year panchanga data
        run: |
          mkdir -p assets
          flutter test test/generate_panchanga_data_test.dart --timeout 15m || echo "Data generation skipped"
          ls -la assets/ || true

      - name: Build Web
        run: flutter build web --release --base-href /bharatiyam-calender-/

      - name: Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup signing files
        run: |
          cp android/app/bharatiyam-release.jks /tmp/bharatiyam-release.jks || true
          cp android/key.properties /tmp/key.properties || true

      - name: Generate platform files
        run: |
          flutter create --project-name bharatiyam_panchanga --org com.bharatiyam --platforms=android,web .
          rm -f test/widget_test.dart

      - name: Restore signing files
        run: |
          cp /tmp/bharatiyam-release.jks android/app/bharatiyam-release.jks || true
          cp /tmp/key.properties android/key.properties || true

      - name: Setup Android
        run: |
          # Write the COMPLETE correct manifest (no more sed hacks)
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application
                  android:label="ಪಂಚಾಂಗ"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-9748660125901669~3232717270"/>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST_EOF
          # SDK versions
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-compute 3-year panchanga data
        run: |
          mkdir -p assets
          flutter test test/generate_panchanga_data_test.dart --timeout 15m || echo "Data generation skipped"
          ls -la assets/ || true

      - name: Patch all plugins to compileSdk 36
        run: |
          find ~/.pub-cache -name "build.gradle" -path "*/android/*" -type f | while read f; do
            sed -i 's/compileSdkVersion 31/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdk 31/compileSdk 36/g' "$f"
            sed -i 's/compileSdk 33/compileSdk 36/g' "$f"
            sed -i 's/compileSdk 34/compileSdk 36/g' "$f"
            sed -i 's/compileSdk = 31/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk = 33/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$f"
          done

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Setup Release Signing
        run: |
          cat >> android/app/build.gradle.kts << 'SIGNING_EOF'

          android.signingConfigs {
              create("release") {
                  storeFile = file("bharatiyam-release.jks")
                  storePassword = "bharatiyam123"
                  keyAlias = "bharatiyam"
                  keyPassword = "bharatiyam123"
              }
          }
          android.buildTypes.getByName("release") {
              signingConfig = android.signingConfigs.getByName("release")
          }
          SIGNING_EOF

      - name: Build APK (split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Build AAB (App Bundle)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bharatiyam-panchanga-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharatiyam-panchanga-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
