name: Build APK & Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate platform files
        run: |
          flutter create --project-name bharatiyam_panchanga --org com.bharatiyam --platforms=android,web .
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Pre-compute 3-year panchanga data
        run: |
          mkdir -p assets
          flutter test test/generate_panchanga_data_test.dart --timeout 15m || echo "Data generation skipped"
          ls -la assets/ || true

      - name: Build Web
        run: flutter build web --release --base-href /bharatiyam-calender-/

      - name: Deploy Web to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup signing files
        run: |
          cp android/app/bharatiyam-release.jks /tmp/bharatiyam-release.jks || true
          cp android/key.properties /tmp/key.properties || true

      - name: Generate platform files
        run: |
          flutter create --project-name bharatiyam_panchanga --org com.bharatiyam --platforms=android,web .
          rm -f test/widget_test.dart

      - name: Restore signing files
        run: |
          cp /tmp/bharatiyam-release.jks android/app/bharatiyam-release.jks || true
          cp /tmp/key.properties android/key.properties || true

      - name: Install NDK r28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" || true

      - name: Setup Android & 16KB page size support
        run: |
          # Permissions
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' android/app/src/main/AndroidManifest.xml
          # App name + extractNativeLibs in one shot
          sed -i 's|android:label="bharatiyam_panchanga"|android:label="ಪಂಚಾಂಗ"\n        android:extractNativeLibs="false"|' android/app/src/main/AndroidManifest.xml
          # SDK versions + NDK + packaging config for 16KB
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          # Append NDK version + packaging config
          cat >> android/app/build.gradle.kts << 'GRADLE_EOF'

          android.ndkVersion = "28.2.13676358"
          android.packaging {
              jniLibs {
                  useLegacyPackaging = false
              }
          }
          GRADLE_EOF
          # Suppress sweph minSdk 16 error with NDK 28
          echo "android.ndk.suppressMinSdkVersionError=21" >> android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Fix sweph for 16KB page alignment (safe - keeps original NDK)
        run: |
          echo "=== Adding 16KB linker flags to sweph (keeping original NDK 21) ==="
          # Only add 16KB linker flags — do NOT change NDK version or source code
          SWEPH_CMAKE=$(find ~/.pub-cache -path "*/sweph-*/android/CMakeLists.txt" -not -path "*/example/*" | head -1)
          if [ -n "$SWEPH_CMAKE" ]; then
            echo "" >> "$SWEPH_CMAKE"
            echo "# 16KB page size support (Google Play requirement)" >> "$SWEPH_CMAKE"
            echo 'set(CMAKE_SHARED_LINKER_FLAGS "${CMAKE_SHARED_LINKER_FLAGS} -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384")' >> "$SWEPH_CMAKE"
            echo "Patched: $SWEPH_CMAKE"
            tail -3 "$SWEPH_CMAKE"
          else
            echo "WARNING: sweph CMakeLists.txt not found!"
          fi
          # Clean cmake cache
          find ~/.pub-cache -path "*/sweph*/.cxx" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "=== Done ==="

      - name: Pre-compute 3-year panchanga data
        run: |
          mkdir -p assets
          flutter test test/generate_panchanga_data_test.dart --timeout 15m || echo "Data generation skipped"
          ls -la assets/ || true

      - name: Patch all plugins to compileSdk 36
        run: |
          find ~/.pub-cache -name "build.gradle" -path "*/android/*" -type f | while read f; do
            sed -i 's/compileSdkVersion 31/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdk 31/compileSdk 36/g' "$f"
            sed -i 's/compileSdk 33/compileSdk 36/g' "$f"
            sed -i 's/compileSdk 34/compileSdk 36/g' "$f"
            sed -i 's/compileSdk = 31/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk = 33/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$f"
          done

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Setup Release Signing
        run: |
          cat >> android/app/build.gradle.kts << 'SIGNING_EOF'

          android.signingConfigs {
              create("release") {
                  storeFile = file("bharatiyam-release.jks")
                  storePassword = "bharatiyam123"
                  keyAlias = "bharatiyam"
                  keyPassword = "bharatiyam123"
              }
          }
          android.buildTypes.getByName("release") {
              signingConfig = android.signingConfigs.getByName("release")
          }
          SIGNING_EOF

      - name: Build APK (split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Build AAB (App Bundle)
        run: flutter build appbundle --release

      - name: Verify 16KB alignment
        run: |
          echo "=== Checking .so alignment in AAB ==="
          cd build/app/outputs/bundle/release/
          unzip -o app-release.aab -d aab_extract || true
          find aab_extract -name "*.so" | while read so; do
            echo "--- $so ---"
            readelf -l "$so" 2>/dev/null | grep -E "LOAD|ALIGN" || true
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bharatiyam-panchanga-apk
          path: build/app/outputs/flutter-apk/
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharatiyam-panchanga-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
