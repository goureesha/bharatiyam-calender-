name: bharatiyam_panchanga
description: "ಭಾರತೀಯಮ್ ಪಂಚಾಂಗ — Hindu Calendar & Panchanga"
publish_to: 'none'
version: 1.3.8+23

environment:
  sdk: '>=3.5.1 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  sweph: ^4.1.0+2.10.3
  shared_preferences: ^2.5.6
  uuid: any
  pdf: ^3.11.3
  path_provider: any
  share_plus: ^10.0.0
  url_launcher: any
  geolocator: ^13.0.0
  intl: any
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  image_picker: any
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/app_icon.png"

dependency_overrides:
  shared_preferences_android: 2.4.28
  shared_preferences_foundation: 2.5.7
  archive: 4.3.0
  image: 4.10.1
  image_picker_ios: 0.8.13+9
  geolocator_apple: 2.3.14
  vm_service: 15.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/
