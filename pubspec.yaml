name: bharatiyam_panchanga
description: "ಭಾರತೀಯಮ್ ಪಂಚಾಂಗ — Hindu Calendar & Panchanga"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  sweph: ^3.2.1+2.10.3
  shared_preferences: any
  uuid: any
  pdf: ^3.11.3
  path_provider: any
  share_plus: ^10.0.0
  url_launcher: any
  geolocator: ^13.0.0
  intl: any
  firebase_core: any
  cloud_firestore: any
  image_picker: any
  # google_mobile_ads: ^9.1.0  # Uncomment when you have real AdMob App ID

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
