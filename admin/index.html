<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಭಾರತೀಯಮ್ ಪಂಚಾಂಗ — Admin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh; color: #e0e0e0;
    }
    .header {
      background: rgba(255,107,0,0.15);
      border-bottom: 2px solid rgba(255,107,0,0.3);
      padding: 20px 30px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { color: #FF6B00; font-size: 22px; }
    .header .stats { display: flex; gap: 20px; }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,107,0,0.2);
      border-radius: 10px; padding: 10px 20px; text-align: center;
    }
    .stat-card .num { font-size: 28px; font-weight: bold; color: #FF6B00; }
    .stat-card .label { font-size: 11px; color: #888; }
    .controls {
      padding: 15px 30px; display: flex; gap: 12px; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .controls input {
      flex: 1; max-width: 400px; padding: 10px 16px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
    }
    .controls input:focus { border-color: #FF6B00; }
    .controls button {
      padding: 10px 20px; background: #FF6B00; color: #fff; border: none;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .controls button:hover { background: #e65c00; }
    .controls .count { color: #888; font-size: 13px; margin-left: auto; }
    .table-wrap { padding: 20px 30px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase;
      color: #FF6B00; border-bottom: 2px solid rgba(255,107,0,0.3);
      cursor: pointer; user-select: none;
    }
    thead th:hover { color: #ffaa55; }
    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    tbody tr:hover { background: rgba(255,107,0,0.06); }
    tbody td { padding: 12px 16px; font-size: 14px; }
    .mobile-col { font-family: monospace; color: #4fc3f7; }
    .date-col { color: #888; font-size: 12px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: bold;
    }
    .badge-new { background: rgba(76,175,80,0.2); color: #4caf50; }
    .badge-updated { background: rgba(33,150,243,0.2); color: #2196f3; }
    .empty-state {
      text-align: center; padding: 60px; color: #666;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 40px; color: #FF6B00; }
    .export-btn {
      padding: 10px 20px; background: rgba(76,175,80,0.2); color: #4caf50;
      border: 1px solid rgba(76,175,80,0.3); border-radius: 8px;
      cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .export-btn:hover { background: rgba(76,175,80,0.3); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>✦ ಭಾರತೀಯಮ್ ಪಂಚಾಂಗ — Admin</h1>
      <p style="color:#888;font-size:12px;margin-top:4px">User Management Dashboard</p>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="num" id="totalCount">—</div>
        <div class="label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="num" id="todayCount">—</div>
        <div class="label">Today</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="🔍 Search by name, mobile, or address..." oninput="filterUsers()">
    <button onclick="refreshData()">⟳ Refresh</button>
    <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
    <span class="count" id="showingCount"></span>
  </div>

  <div class="table-wrap">
    <div class="loading" id="loadingMsg">⏳ Loading users...</div>
    <table id="usersTable" style="display:none">
      <thead>
        <tr>
          <th onclick="sortBy('index')">#</th>
          <th onclick="sortBy('name')">Name ↕</th>
          <th onclick="sortBy('address')">Address ↕</th>
          <th onclick="sortBy('mobile')">Mobile ↕</th>
          <th onclick="sortBy('createdAt')">Joined ↕</th>
          <th onclick="sortBy('updatedAt')">Last Updated ↕</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon">📭</div>
      <p>No users found</p>
    </div>
  </div>

  <!-- Firebase JS SDK (compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    // ── Firebase Config ──
    // NOTE: You may need to add a Web App in Firebase Console and use its config
    firebase.initializeApp({
      apiKey: "AIzaSyCrF2hsOC1nhmvYEqdVZD35n6MIShKPUDk",
      projectId: "bharatiyam-calender",
      storageBucket: "bharatiyam-calender.firebasestorage.app",
      appId: "1:1085359219387:android:0b9a94c1c6a8d80e6abf9e",
    });

    const db = firebase.firestore();
    let allUsers = [];
    let sortField = 'createdAt';
    let sortDir = -1;

    async function refreshData() {
      document.getElementById('loadingMsg').style.display = 'block';
      document.getElementById('usersTable').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';

      try {
        const snap = await db.collection('users').orderBy('createdAt', 'desc').get();
        allUsers = snap.docs.map((doc, i) => ({
          id: doc.id,
          index: i + 1,
          ...doc.data(),
        }));

        document.getElementById('totalCount').textContent = allUsers.length;

        // Count today's users
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayUsers = allUsers.filter(u => {
          if (!u.createdAt) return false;
          const d = u.createdAt.toDate ? u.createdAt.toDate() : new Date(u.createdAt);
          return d >= today;
        });
        document.getElementById('todayCount').textContent = todayUsers.length;

        renderTable();
      } catch (e) {
        console.error('Error:', e);
        document.getElementById('loadingMsg').innerHTML =
          '❌ Error loading data. Make sure Firestore rules allow read access.<br><small>' + e.message + '</small>';
      }
    }

    function renderTable() {
      const search = document.getElementById('searchBox').value.toLowerCase();
      let filtered = allUsers.filter(u =>
        (u.name || '').toLowerCase().includes(search) ||
        (u.mobile || '').includes(search) ||
        (u.address || '').toLowerCase().includes(search)
      );

      // Sort
      filtered.sort((a, b) => {
        let va = a[sortField] || '';
        let vb = b[sortField] || '';
        if (va?.toDate) va = va.toDate();
        if (vb?.toDate) vb = vb.toDate();
        if (va < vb) return -sortDir;
        if (va > vb) return sortDir;
        return 0;
      });

      const tbody = document.getElementById('usersBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        document.getElementById('usersTable').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
      } else {
        document.getElementById('usersTable').style.display = 'table';
        document.getElementById('emptyState').style.display = 'none';
      }

      filtered.forEach((u, i) => {
        const created = formatDate(u.createdAt);
        const updated = formatDate(u.updatedAt);
        const isNew = isToday(u.createdAt);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td><strong>${esc(u.name || '—')}</strong>
            ${isNew ? '<span class="badge badge-new">NEW</span>' : ''}</td>
          <td>${esc(u.address || '—')}</td>
          <td class="mobile-col">${esc(u.mobile || '—')}</td>
          <td class="date-col">${created}</td>
          <td class="date-col">${updated}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('showingCount').textContent =
        `Showing ${filtered.length} of ${allUsers.length}`;
      document.getElementById('loadingMsg').style.display = 'none';
    }

    function formatDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
    }

    function isToday(ts) {
      if (!ts) return false;
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const today = new Date();
      return d.getDate() === today.getDate() &&
        d.getMonth() === today.getMonth() &&
        d.getFullYear() === today.getFullYear();
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function filterUsers() { renderTable(); }

    function sortBy(field) {
      if (sortField === field) sortDir *= -1;
      else { sortField = field; sortDir = 1; }
      renderTable();
    }

    function exportCSV() {
      if (allUsers.length === 0) return;
      const rows = [['#', 'Name', 'Address', 'Mobile', 'Joined', 'Updated']];
      allUsers.forEach((u, i) => {
        rows.push([
          i + 1,
          `"${(u.name || '').replace(/"/g, '""')}"`,
          `"${(u.address || '').replace(/"/g, '""')}"`,
          u.mobile || '',
          formatDate(u.createdAt),
          formatDate(u.updatedAt),
        ]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bharatiyam_users_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Load on page open
    refreshData();
  </script>
</body>
</html>
